<!DOCTYPE html>
<html>
<head>
  <title>Muokkaa viestiä</title>
</head>
<body>
  <h2>Muokkaa viestiä</h2>
<form action="/edit/{{ message.id }}" method="post">
    <p>
      Viesti:<br />
      <textarea name="content" rows="5" cols="40" maxlength="5000" required>{{ message.content }}</textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Tallenna muutokset" />
  </form>
</body>
</html>

{% extends "layout.html" %}

{% block title %}Luo pelivuoro{% endblock %}

{% block content %}
  <h2>Ilmoita uusi pelivuoro</h2>
  <form action="/new_thread" method="post">
    <p>
      <label for="play_time">Peliaika</label>: <br />
      <input type="datetime-local" id="play_time" name="play_time" min="{{ min_time }}" step="3600" required />
    </p>
    <p>
      <label for="location">Pelipaikka</label>: <br />
      <select id="location" name="location" required>
        <option value="Kimpisen massatenniskentät">Kimpisen massatenniskentät</option>
        <option value="Huhtiniemen sisähalli">Huhtiniemen sisähalli</option>
      </select>
    </p>
    <p>
      <label for="skill_level">Pelaajan taso</label>: <br />
      <select id="skill_level" name="skill_level" required>
        <option value="Aloittelija">Aloittelija</option>
        <option value="Keskitaso">Keskitaso</option>
        <option value="Kilpa">Kilpa</option>
      </select>
    </p>
    <p>
      <label for="player_count">Tarvittavien pelaajien määrä</label>: <br />
      <input type="number" id="player_count" name="player_count" min="1" max="4" value="1" required />
    </p>
    <p>
      <label for="duration">Vuoron kesto (tunteina)</label>: <br />
      <input type="number" id="duration" name="duration" min="1" max="10" value="1" required />
    </p>
    <p>
      <label for="content">Lisätiedot</label>: <br />
      <textarea id="content" name="content" rows="4" maxlength="5000" placeholder="Esim. Kenttämaksu puolitetaan..."></textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Julkaise ilmoitus" />
  </form>
{% endblock %}
